name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff for correctness bugs, missing or
            weak test coverage, and style consistency with the rest of
            textstats.py.

            Note: The PR branch is already checked out in the current
            working directory.

            Submit your findings as a single formal GitHub PR review via
            `gh pr review` (approve, comment, or request-changes as
            appropriate). Use `gh pr comment` for top-level feedback and
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific lines. Only post
            GitHub comments/reviews - don't just print review text as a
            message. If the PR looks correct and well-tested, approve it
            with a short note saying so.

            You are strictly read/comment-only: never push commits, never
            open a new PR, never edit files.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*)"
